# Packaging metadata still lives in setup.py; this file only configures tools.

[tool.semantic_release]
# alerce/__init__.py is the source of truth (setup.py reads it); the docs keep
# their own copy.
version_variables = [
    "alerce/__init__.py:__version__",
    "docs/source/conf.py:release",
]
tag_format = "v{version}"
commit_parser = "conventional"
# Conventional, so the parser ignores release commits on the next run.
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# build.yml builds and publishes once a release is published on GitHub.
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
