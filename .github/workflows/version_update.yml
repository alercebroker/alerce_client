name: Version
on:
  push:
    branches:
      - main
    paths:
      - 'alerce/**'
      - 'requirements.txt'
      - 'setup.py'

# All writes go through ADMIN_TOKEN; GITHUB_TOKEN needs no access.
permissions: {}

# Never run two releases at once; a queued run picks up the newer commits.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  versioning:
    # The release commit pushed by this job touches alerce/ and would retrigger it.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code  # zizmor: ignore[artipacked]
        # Credentials must persist for the release commit and tag push.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}
      - name: Pin branch to the triggering commit
        # Checking out by branch name may pick up commits pushed after this run started.
        run: git reset --hard "$GITHUB_SHA"
      # Bumps alerce/__init__.py and docs/source/conf.py, commits and tags.
      # No GitHub release: publishing one from the tag is the manual gate
      # that triggers build.yml.
      - name: Semantic Release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}
          git_committer_name: alerceadmin
          git_committer_email: alerceadmin@users.noreply.github.com
          changelog: "false"
          vcs_release: "false"
          build: "false"
