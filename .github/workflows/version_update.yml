name: CI
on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'alerce/**'

# All writes go through ADMIN_TOKEN; GITHUB_TOKEN needs no access.
permissions: {}

jobs:
  versioning:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Checkout code  # zizmor: ignore[artipacked]
        # Credentials must persist for the final `git push`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}
      - name: Semantic Release
        run: |
          git config --global user.name "@alerceadmin"
          git config --global user.email "alerceadmin@users.noreply.github.com"
          pip install python-semantic-release==7.28.1
          semantic-release version
          git push
