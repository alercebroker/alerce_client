name: Move new issues into Backlog

on:
  issues:
    types: [opened]

# The action authenticates with ADMIN_TOKEN; GITHUB_TOKEN needs no access.
permissions: {}

jobs:
  issue_opened_or_reopened:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to New
        uses: leonsteinhaeuser/project-beta-automations@939000fb1900c9fc4f7b5058a09d9f833ebc6859 # v2.2.1
        with:
          gh_token: ${{ secrets.ADMIN_TOKEN }}
          organization: alercebroker
          project_id: 14
          resource_node_id: ${{ github.event.issue.node_id }}
          status_value: New
