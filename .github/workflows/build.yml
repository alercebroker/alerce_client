name: Build Package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The wheel is pure Python, so the build interpreter does not affect it.
    - name: Set up Python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    # Runtime dependencies are not needed: build uses an isolated environment
    # and the smoke test installs the wheel with its dependencies. Keep
    # third-party code out of the job that holds the PyPI token.
    - name: Install build
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build a binary wheel and a source tarball
      run: |
        python -m build --sdist --wheel --outdir dist/ .
    # 2.1.0 shipped without default_config.json; install the wheel in a clean
    # venv, outside the source tree, and load the config before uploading.
    - name: Smoke-test the wheel
      run: |
        python -m venv "$RUNNER_TEMP/smoke"
        "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/smoke/bin/python" -c "from alerce.utils import load_config; assert load_config(None); from alerce.core import Alerce; Alerce()"
    - name: Publish Python distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
