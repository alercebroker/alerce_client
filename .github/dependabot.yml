version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    # PR titles must be conventional commits; ci does not trigger a release.
    commit-message:
      prefix: "ci"
      include: "scope"
